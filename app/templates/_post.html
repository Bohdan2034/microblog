<div class="row border-bottom py-3 align-items-start">
    <div class="col-auto">
        <img src="{{ post.author.avatar(36) }}"
             class="rounded"
             alt="{{ post.author.username }}">
    </div>

    <div class="col">
        <a href="{{ url_for('user', username=post.author.username) }}"
           class="fw-semibold text-decoration-none">
            {{ post.author.username }}
        </a>

        <span class="text-muted">
            says {{ moment(post.timestamp).fromNow() }}:
        </span>

        <p class="mb-0 mt-1">{{ post.body }}</p>

        <div class="mt-2 d-flex gap-2 align-items-center">

            <!-- LIKE / UNLIKE -->
            {% if current_user.has_liked_post(post) %}
                <form action="{{ url_for('unlike_post', post_id=post.id) }}"
                      method="post">

                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <button type="submit" class="btn btn-sm btn-danger">
                        ♥ Unlike
                    </button>
                </form>
            {% else %}
                <form action="{{ url_for('like_post', post_id=post.id) }}"
                      method="post">

                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        ♡ Like
                    </button>
                </form>
            {% endif %}

            <!-- Лічильник лайків -->
            <span class="text-muted">
                {{ post.likes_count() }} Likes
            </span>

            {% if post.author == current_user %}

                <!-- EDIT POST -->
                <a href="{{ url_for('edit_post', post_id=post.id) }}"
                   class="btn btn-sm btn-outline-primary">
                    Edit
                </a>

                <!-- DELETE POST -->
                <form action="{{ url_for('delete_post', post_id=post.id) }}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this post?');">

                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <button type="submit"
                            class="btn btn-sm btn-outline-danger">
                        Delete
                    </button>
                </form>

            {% endif %}
        </div>
    </div>
</div>
